# Render Blueprint: the site and the API as one web service (render.com -> New -> Blueprint).
# The Python version comes from .python-version.
services:
  - type: web
    name: immoonity
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /api/health
